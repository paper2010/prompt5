[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt5"
version = "0.0.1"
description = "Adaptive prompt generator: IR + two-phase applier + per-model evaluation"
requires-python = ">=3.11"
# 目标依赖（当前环境 PyPI 不可达，见 NOTES.md #1；M0 运行不依赖这些包）
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "jsonschema>=4.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
